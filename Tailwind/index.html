<!DOCTYPE html>
<html lang="en">

    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>HTML + CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-red-100 text-black">
    <section class="space-y-5 text-center max-w-3xl mx-auto px-5 py-12">
      <h1 class="text-3xl text-blue-600 border-red-100 border-2 font-bold">
        This is h1
      </h1>
      <p class="text-[1.2rem]">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Officia
        repellat, accusantium consequuntur veniam quam quas possimus vel sed quo
        magnam in, magni facilis atque facere praesentium tempore sunt optio

      <a class="bg-fuchsia-500 py-6 px-5 inline-block rounded-full hover:bg-fuchsia-700 transition-colors"

      >
    </section>
    <div class="ml-2 text-right">
      <h1>This is out of section tag</h1>

</html>
